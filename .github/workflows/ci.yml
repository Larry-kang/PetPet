name: PetPet CI

permissions:
  contents: read

on:
  push:
    branches: [ "master", "main", "codex/**" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    # The downloadable Demo and its native media dependencies are verified on Windows.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore PetPet.Modern/PetPet.Modern.sln

    - name: Build
      run: dotnet build PetPet.Modern/PetPet.Modern.sln --no-restore

    - name: Test
      run: dotnet test PetPet.Modern/tests/PetPet.UnitTests/PetPet.UnitTests.csproj --no-build --verbosity normal
